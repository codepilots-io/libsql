name: Build libsql-server image

on:
  push:
    branches: [codepilots]
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/libsql-server

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Free runner disk space (Rust release build is large)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=sha,format=long
            type=raw,value=edge,enable=${{ github.ref == 'refs/heads/codepilots' }}
            type=match,pattern=v(.*),group=1
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
          labels: |
            org.opencontainers.image.title=libsql-server
            org.opencontainers.image.description=libsql-server (sqld) with write-lock fixes; see CHANGELOG.md

      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.codepilots
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test the pushed image
        env:
          REF: ${{ env.IMAGE }}@${{ steps.build.outputs.digest }}
        run: |
          echo "Image: $REF"
          docker run --rm --entrypoint /bin/sqld "$REF" --version
          docker run -d --name sqld -p 8080:8080 -e SQLD_NODE=primary -e SQLD_HTTP_LISTEN_ADDR=0.0.0.0:8080 "$REF"
          for i in $(seq 1 30); do curl -sf -X POST -H content-type:application/json --data '{"statements":["SELECT 1"]}' http://127.0.0.1:8080/ >/dev/null && break; sleep 1; done
          curl -sf -X POST -H content-type:application/json \
            --data '{"statements":["CREATE TABLE t(x)","INSERT INTO t VALUES (1)","SELECT count(*) FROM t"]}' http://127.0.0.1:8080/
          echo
          echo "### Published \`$REF\`" >> "$GITHUB_STEP_SUMMARY"
