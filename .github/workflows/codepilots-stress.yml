name: Stress-test libsql-server image

on:
  workflow_dispatch:
    inputs:
      image:
        description: Image to test (tag or digest)
        default: ghcr.io/codepilots-io/libsql-server:edge
      sqld_args:
        description: Extra docker run arguments for sqld, e.g. "-e SQLD_CHECKPOINT_INTERVAL_S=60"
        default: ""

permissions:
  contents: read
  packages: read

env:
  IMAGE: ${{ inputs.image }}
  SQLD_ARGS: ${{ inputs.sqld_args }}

jobs:
  stress:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Standard stress (hot-row write pattern), 5 x 3 min
        run: codepilots/stress/run.sh standard 5 180
      - name: Extreme stress, 2 x 10 min
        run: codepilots/stress/run.sh extreme 2 600

  overload:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Overload at 1 CPU / 1 GB, 2 x 5 min
        run: |
          fails=0
          for i in 1 2; do
            codepilots/stress/overload.sh 300 || fails=$((fails+1))
            mv run-overload-sqld.log run-overload-sqld-$i.log; mv run-overload-threads.log run-overload-threads-$i.log
            mv run-overload.log run-overload-$i.log
          done
          [ "$fails" = 0 ]
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: overload-logs
          path: run-overload-*.log
